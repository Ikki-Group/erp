name: CI

on:
  pull_request:
  push:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  BUN_VERSION: 1.4.2

jobs:
  root:
    name: Root (check)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check (lint, format, knip)
        run: bun run check

  server:
    name: Server (verify + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test-user
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ikki_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test-user -d ikki_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://test-user:test@localhost:5432/ikki_test

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bunx oxfmt --check apps/server

      - name: Verify (lint, typecheck, knip, circular deps)
        run: bun --filter @ikki/server verify

      - name: Migrate + seed test database
        working-directory: apps/server
        run: bun run test:db:reset

      - name: Test
        working-directory: apps/server
        run: bun run test

      - name: Build binaries
        working-directory: apps/server
        run: bun run build

  web:
    name: Web (verify + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify (lint, typecheck, tests)
        run: bun --filter @ikki/web verify

      - name: Build
        run: bun --filter @ikki/web build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [server, web]

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test-user
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ikki_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U test-user -d ikki_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://test-user:test@localhost:5433/ikki_test

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browser
        working-directory: apps/e2e
        run: bunx playwright install --with-deps chromium

      # scripts/test-e2e.sh reads apps/server/.env.test, which is gitignored.
      - name: Write server test env
        run: |
          cat > apps/server/.env.test <<'EOF'
          NODE_ENV=test
          DATABASE_URL=${{ env.DATABASE_URL }}
          OTEL_LOGS_ENABLED=false
          LOG_LEVEL=error
          AUTH_RATE_LIMIT_ENABLED=false
          EOF

      - name: Run E2E
        run: ./scripts/test-e2e.sh

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/e2e/playwright-report
          retention-days: 7

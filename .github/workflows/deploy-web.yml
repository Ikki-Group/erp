name: Deploy web to Cloudflare Pages

# Runs only after CI succeeds on a push to main (or manually). workflow_run cannot filter by
# path, so every successful main push redeploys the web app; main only moves on releases.
on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

env:
  CLOUDFLARE_PROJECT_MAIN: ikki-erp
  CLOUDFLARE_PROJECT_DEV: ikki-erp-dev

jobs:
  build_and_deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    concurrency: deploy-web
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Deploy exactly the commit CI validated.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Use Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # Monorepo optimization: Install dependencies from the root to leverage the global lockfile and shared cache
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Build specifically for the web package
      - name: Build web app
        run: |
          cd apps/web
          bun run build

      - name: Determine Cloudflare project
        id: cf
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
        run: |
          if [ "${BRANCH}" = "main" ]; then
            echo "project=${CLOUDFLARE_PROJECT_MAIN}" >> $GITHUB_OUTPUT
          elif [ "${BRANCH}" = "dev" ]; then
            echo "project=${CLOUDFLARE_PROJECT_DEV}" >> $GITHUB_OUTPUT
          else
            echo "Skipping deployment: branch ${BRANCH} is not main or dev"
            echo "skip=true" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.cf.outputs.skip != 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: pages deploy dist --project-name=${{ steps.cf.outputs.project }}

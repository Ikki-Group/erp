name: Deploy server to Fly.io
permissions:
  contents: read

# Runs only after CI succeeds on a push to main (or manually).
on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    concurrency: deploy-server
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Deploy exactly the commit CI validated.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # Build context is the repo root so bun's workspace-wide lockfile is available;
      # config/Dockerfile point at apps/server. fly.toml's release_command runs
      # /app/migrate before the new version starts.
      - run: flyctl deploy --remote-only --config apps/server/fly.toml --dockerfile apps/server/Dockerfile
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
